name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned deliberately. Unpinned, a ruff release changes the result of CI
      # on unchanged code — 0.16 began formatting Python inside Markdown and
      # broke this job with no commit behind it. Bump this on purpose.
      - run: pip install ruff==0.16.3
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy src/pki/core

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pip-audit audits the whole environment, including the venv bootstrap.
      # The runner's stock pip/setuptools carry their own advisories, which
      # failed this job for vulnerabilities in build tooling that pki-core
      # neither ships nor imports. Upgrade them rather than suppress the
      # findings, so the gate keeps reporting real ones.
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]" bandit pip-audit cyclonedx-bom
      - run: bandit -r src/pki/core -c pyproject.toml --severity-level high
      - run: pip-audit
      - run: cyclonedx-py environment -o sbom.cdx.json --of json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short
